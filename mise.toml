min_version = "2026.6.1"

[settings]
lockfile = true
jobs = 4

[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
goreleaser = "2.17.1"
gotestsum = "1.13.0"
hk = "1.55.0"
pkl = "0.32.1"

[env]
HK_MISE = 1

[hooks]
enter = ["mise install"]
postinstall = ["hk install --mise"]

[tasks.gate]
description = "Everything CI runs: format check, vet, lint, tests"
depends = ["fmt", "vet", "lint", "test"]
